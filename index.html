<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYXER LINK</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s ease-out;
        }
        
        
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #fff, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }
        
        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
            animation: fadeIn 1s ease-out 0.3s both;
        }
        
        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-decoration: none;
        }
        
        .social-icon:hover {
            transform: translateY(-5px) scale(1.1);
        }
        
        .instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
        }
        
        .tiktok {
            background: #000;
            color: #69C9D0;
        }
        
        .youtube {
            background: #FF0000;
            color: white;
        }
        
        /* Buttons */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease-out both;
        }
        
        .btn:hover {
            background: rgba(233, 69, 96, 0.2);
            transform: translateX(10px);
            border-color: #e94560;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.2);
        }
        
        .btn-icon {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
        }
        
        .btn-text {
            flex-grow: 1;
            text-align: left;
            margin-left: 1rem;
            font-weight: 500;
        }
        
        .btn-arrow {
            color: #a0a0a0;
            transition: transform 0.3s ease;
        }
        
        .btn:hover .btn-arrow {
            transform: translateX(5px);
            color: #e94560;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Delay animations */
        .btn:nth-child(1) { animation-delay: 0.1s; }
        .btn:nth-child(2) { animation-delay: 0.2s; }
        .btn:nth-child(3) { animation-delay: 0.3s; }
        
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
            font-size: 0.9rem;
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .social-icon {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo"></div>
            <h1 class="title">RAY LINK</h1>
            <p class="subtitle">Find Me on All Platforms  RIGHT HERE!</p>
        </div>
        
        <!-- Social Icons -->
        <div class="social-icons">
            <a href="https://www.instagram.com/raywisp_?igsh=MWFyazVtaGRjczM4eQ==" target="_blank" class="social-icon instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/@raywisp_?_r=1&_t=ZS-94W6VyafM28" target="_blank" class="social-icon tiktok">
                <i class="fab fa-tiktok"></i>
            </a>
            <a href="https://youtube.com/@c4zhme?si=E2Z5KBxms4kTwCZA" target="_blank" class="social-icon youtube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
        
        <!-- Link Buttons -->
        <div class="buttons">
            <a href="https://www.instagram.com/raywisp_?igsh=MWFyazVtaGRjczM4eQ==" target="_blank" class="btn">
                <div class="btn-icon">
                    <i class="fab fa-instagram"></i>
                </div>
                <span class="btn-text">Instagram</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </a>
            
            <a href="https://www.tiktok.com/@raywisp_?_r=1&_t=ZS-94W6VyafM28" target="_blank" class="btn">
                <div class="btn-icon">
                    <i class="fab fa-tiktok"></i>
                </div>
                <span class="btn-text">TikTok</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </a>
            
            <a href="https://youtube.com/@c4zhme?si=E2Z5KBxms4kTwCZA" target="_blank" class="btn">
                <div class="btn-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <span class="btn-text">YouTube</span>
                <i class="fas fa-chevron-right btn-arrow"></i>
            </a>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>© 2025 RAYXR. All rights reserved.</p>
        </div>
    </div>
    
    <script>
        // Tambahkan efek interaktif sederhana
        document.addEventListener('DOMContentLoaded', function() {
            // Efek klik pada tombol
            const buttons = document.querySelectorAll('.btn, .social-icon');
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    // Visual feedback saat diklik
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });
            
            // Smooth scroll behavior
            document.documentElement.style.scrollBehavior = 'smooth';
        });
    </script>
</body>
</html>
